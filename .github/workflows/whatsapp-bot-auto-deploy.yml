name: WhatsApp Bot Release Validation

on:
  push:
    branches:
      - main
    paths:
      - "apps/whatsapp-bot-node/**"
      - ".github/workflows/whatsapp-bot-auto-deploy.yml"
  workflow_dispatch:

jobs:
  test-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/whatsapp-bot-node

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/whatsapp-bot-node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
