name: WhatsApp Bot Inactivity Check

on:
  # El modo WhatsApp Web ejecuta este control en la PC operativa.
  # Se conserva la ejecución manual sólo para diagnósticos del modo Cloud.
  workflow_dispatch:

jobs:
  run-inactivity-check:
    runs-on: ubuntu-latest

    steps:
      - name: Validate secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured"
            exit 1
          fi

      - name: Ping production inactivity endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://whatsapp-bot-node-chatbot1.vercel.app/api/cron/inactivity")"
          echo "$response"
