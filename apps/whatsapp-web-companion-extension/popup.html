<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WhatsApp Companion</title>
  <style>
    body{margin:0;padding:16px;width:280px;font:14px/1.4 system-ui,sans-serif;background:#08111f;color:#eef5ff}
    h1{margin:0 0 8px;font-size:16px}
    p{margin:0 0 12px;color:#a9bdd8}
    .card{border:1px solid #274163;background:#0f1d32;border-radius:14px;padding:12px;display:grid;gap:10px}
    button{border:1px solid #33598a;background:#153051;color:#eef5ff;border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}
    button:hover{border-color:#4b7ebd}
    .muted{font-size:12px;color:#8ea5c5}
  </style>
</head>
<body>
  <div class="card">
    <h1>WhatsApp Companion</h1>
    <p>Superpone filtros y etiquetas operativas dentro de WhatsApp Web usando nuestro backend.</p>
    <button id="open-whatsapp">Abrir WhatsApp Web</button>
    <button id="open-options">Configurar conexion</button>
    <div class="muted" id="status">Leyendo configuracion...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
